plugins {
    id 'com.gradleup.shadow' version '9.6.1'
    id 'java'
}

group = 'com.martinfrancois'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:30.1.1-jre'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // Keeps the hashes.txt that App writes to its working directory out of the project root.
    File testWorkDir = layout.buildDirectory.dir('test-work').get().asFile
    workingDir = testWorkDir
    doFirst { testWorkDir.mkdirs() }
}

jar {
  manifest {
    attributes(
      'Main-Class': 'com.martinfrancois.recursivehash.App'
    )
  }
}
